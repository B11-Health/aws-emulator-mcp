# Example only: fill placeholders on target host. Never commit live secrets
# or unguessable capability URL paths. Protect completed config mode 0600.
limit_req_zone $binary_remote_addr zone=codegym_mcp:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=codegym_relay:10m rate=15r/m;

server {
 listen 443 ssl;
 server_name __MCP_HOSTNAME__;
 ssl_certificate __MCP_FULLCHAIN__;
 ssl_certificate_key __MCP_PRIVATE_KEY__;
 ssl_client_certificate __TRUSTED_OPENAI_MTLS_CA_CHAIN__;
 ssl_verify_client on;
 ssl_verify_depth 3;
 client_max_body_size 128k;
 server_tokens off;
 location = /__PRIVATE_CAPABILITY_PATH__/mcp {
  limit_except POST { deny all; }
  limit_req zone=codegym_mcp burst=15 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Host 127.0.0.1:__LOCAL_GATEWAY_PORT__;
  proxy_set_header X-CodeGym-Verified $ssl_client_verify;
  proxy_set_header X-CodeGym-Client-Cert $ssl_client_escaped_cert;
  proxy_set_header X-CodeGym-Edge-Token __PRIVATE_EDGE_TOKEN__;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_connect_timeout 3s;
  proxy_read_timeout 28s;
  proxy_pass http://127.0.0.1:__LOCAL_GATEWAY_PORT__/mcp;
 }
 location / { return 404; }
}

server {
 listen 443 ssl;
 server_name __RELAY_HOSTNAME__;
 ssl_certificate __RELAY_FULLCHAIN__;
 ssl_certificate_key __RELAY_PRIVATE_KEY__;
 client_max_body_size 128k;
 server_tokens off;
 location = /agent {
  limit_req zone=codegym_relay burst=8 nodelay;
  proxy_http_version 1.1;
  proxy_set_header Host 127.0.0.1:__LOCAL_GATEWAY_PORT__;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_buffering off;
  proxy_connect_timeout 4s;
  proxy_read_timeout 120s;
  proxy_pass http://127.0.0.1:__LOCAL_GATEWAY_PORT__/agent;
 }
 location / { return 404; }
}
