[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-emulator-mcp"
version = "0.2.0"
description = "Safe MCP adapter to the official AWS Emulator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
aws-emulator-mcp = "aws_emulator_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
