<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1260 464">
<title id="title">AWS Emulator MCP local architecture and security boundary</title>
<desc id="description">A local MCP client calls the Node launcher, which starts a network-isolated Docker lab with a Python MCP server, the signed official AWS Emulator, and modeled SDK services. Results return as structured evidence. No host mounts, no forwarded ports, no real AWS credentials. A modeled SDK operation does not necessarily work in the emulator.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0C172A"/><stop offset="1" stop-color="#12253A"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#75DECE" stroke-width="1.7"/></marker>
</defs>
<rect width="1260" height="464" rx="22" fill="url(#bg)"/>
<text x="44" y="51" fill="#ECF7FF" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="26">The local-first architecture</text>
<text x="44" y="81" fill="#A2B6C8" font-family="Inter,Arial,sans-serif" font-size="15">An agent gets access to an isolated emulator — not to your production AWS account.</text>
<rect x="35" y="120" width="236" height="212" rx="17" fill="#13283C" stroke="#426E84" stroke-width="1.5"/>
<text x="55" y="155" fill="#71E5D1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">01 / MCP CLIENT</text>
<text x="55" y="197" fill="#ECF7FF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Your AI</text>
<text x="55" y="229" fill="#B7CBDB" font-family="Inter,Arial,sans-serif" font-size="16">VS Code / agent /</text>
<text x="55" y="251" fill="#B7CBDB" font-family="Inter,Arial,sans-serif" font-size="16">compatible host</text>
<text x="55" y="300" fill="#7D93A7" font-family="Inter,Arial,sans-serif" font-size="14">Stdio on your machine</text>
