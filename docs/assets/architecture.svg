<rect x="625" y="110" width="591" height="234" rx="19" fill="#101E2C" stroke="#5B9BA3" stroke-width="2" stroke-dasharray="8 5"/>
<text x="647" y="143" fill="#92E9D8" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="14">03 / NETWORK-ISOLATED DOCKER LAB</text>
<rect x="648" y="163" width="248" height="148" rx="13" fill="#1A3145" stroke="#41677C"/>
<text x="664" y="194" fill="#EFF9FE" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Python MCP</text>
<text x="664" y="223" fill="#BCD1DF" font-family="Inter,Arial,sans-serif" font-size="15">29 curated tools</text>
