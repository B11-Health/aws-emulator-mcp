<rect x="328" y="120" width="240" height="212" rx="17" fill="#13283C" stroke="#426E84" stroke-width="1.5"/>
<text x="348" y="155" fill="#71E5D1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">02 / NODE LAUNCHER</text>
<text x="348" y="195" fill="#ECF7FF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">aws-emulator-mcp</text>
<text x="348" y="230" fill="#B7CBDB" font-family="Inter,Arial,sans-serif" font-size="16">Doctor · Coverage</text>
<text x="348" y="253" fill="#B7CBDB" font-family="Inter,Arial,sans-serif" font-size="16">Experiments · MCP</text>
<text x="348" y="300" fill="#7D93A7" font-family="Inter,Arial,sans-serif" font-size="14">Local Docker only</text>
