name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-protocol:
    name: Unit & MCP / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and run all unit/security tests
        run: |
          python -m compileall -q src tests scripts
          python -m unittest discover -s tests -q
      - name: Independent legacy/modern MCP checker
        run: |
          mkdir -p reports
          python scripts/mcp_launch_check.py --out reports/ci_protocol.json --min-tools 27 -- python -u src/aws_emulator_mcp/server.py
      - name: Build installable wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m zipfile -t dist/*.whl
      - name: Upload sanitized protocol results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-python-${{ matrix.python }}
          path: reports/ci_protocol.json
          if-no-files-found: error

  live-official-aws:
    name: Signed AWS Emulator / real E2E
    needs: unit-and-protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download and verify official AWS Emulator
        run: bash scripts/install_wsl.sh
      - name: Run complete real MCP service test
        run: python scripts/live_test.py
      - name: Measure reliability, latency, and scoped cleanup
        run: python scripts/gtm_benchmark.py --skip-unit --repetitions 5
      - name: Stop only the MCP-managed test process
        if: always()
        run: |
          PYTHONPATH=src python - <<'PY'
          from aws_emulator_mcp import server
          try:
              print(server.stop())
          except Exception as exc:
              print("No MCP-managed process to stop:", type(exc).__name__)
          PY
      - name: Upload sanitized benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-official-live-evidence
          path: |
            reports/latest_live.json
            reports/gtm_latest.json
          if-no-files-found: warn
