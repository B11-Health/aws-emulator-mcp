name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly, not daily: check upstream emulator compatibility with a bounded
  # private-runner cost. Never auto-publish on a scheduled run.
  schedule:
    - cron: '31 13 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-protocol:
    name: Unit & MCP / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile, scan, and run all unit/security tests
        run: |
          python -m compileall -q src tests scripts
          python scripts/release_scan.py
          python -m unittest discover -s tests -q
      - name: Independent static security scan (medium/high findings fail)
        run: |
          python -m pip install --disable-pip-version-check bandit==1.9.2
          python -m bandit -r src/aws_emulator_mcp remote_connector -ll -q
      - name: Independent legacy/modern MCP checker
        run: |
          mkdir -p reports
          python scripts/mcp_launch_check.py --out reports/ci_protocol.json --min-tools 29 -- python -u src/aws_emulator_mcp/server.py
      - name: Build installable wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m zipfile -t dist/*.whl
      - name: Record protocol evidence without artifact storage
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          result=json.load(open("reports/ci_protocol.json"))
          assert result["passed"]
          print("### Independent MCP protocol check")
          for run in result["runs"]:
              print("- ",run["scope"],":", "PASS" if run["passed"] else "FAIL")
          PY

  client-sdk-interop:
    name: Official Python + TypeScript MCP SDK clients
    needs: unit-and-protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Official Python SDK v2.3.0 interop, both protocol eras
        run: |
          python -m pip install --disable-pip-version-check mcp==2.3.0
          python tests/external_clients/python_client.py
      - name: Official TypeScript SDK v2.4.0 interop, both protocol eras
        run: |
          npm ci --prefix tests/external_clients --no-audit --no-fund --ignore-scripts
          node tests/external_clients/node_client.mjs

  windows-source-preview:
    name: Windows 2025 source and installer preview
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Source integrity scan on independent Windows
        run: python scripts/release_scan.py
      - name: Media signatures and posters on Windows
        run: python -m unittest tests.test_launch_media.LaunchMediaTests.test_asset_structure_and_bounded_file_sizes -v
      - name: Offline tour static assets on Windows
        run: python -m unittest tests.test_launch_media.LaunchMediaTests.test_onboarding_site_is_self_contained -v
      - name: Launch copy consistency on Windows
        run: python -m unittest tests.test_launch_media.LaunchMediaTests.test_launch_copy_is_brand_consistent -v
      - name: README links and published claims on Windows
        run: python -m unittest tests.test_public_story -v
      - name: Remaining Python tests on Windows
        run: python -m unittest discover -s tests -q
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify Windows npm tarball contains no bytecode or unexpected files
        shell: pwsh
        run: |
          npm pack --dry-run --json | Out-File -Encoding utf8 "$env:RUNNER_TEMP/npm-pack.json"
          python -c "import json,os,pathlib; d=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'npm-pack.json').read_text(encoding='utf-8-sig'))[0]; allowed=set(json.loads(pathlib.Path('package.json').read_text())['files'])|{'package.json','LICENSE','README.md'}; actual={x['path'] for x in d['files']}; assert actual==allowed, {'extra':sorted(actual-allowed),'missing':sorted(allowed-actual)}; assert not any('__pycache__' in x or x.endswith('.pyc') for x in actual); print('Windows npm package exact allowlist PASS',len(actual))"
      - name: PowerShell syntax and non-mutating Windows installation preview
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/connect_copilot.ps1).Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            throw "Client connector PowerShell parse failed"
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Preview
  npm-package-smoke:
    name: npm tarball and Node CLI / no registry publish
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test Node CLI and pack without publishing
        run: |
          npm test
          npm pack --dry-run --json > /tmp/aws-emulator-mcp-npm-package.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/aws-emulator-mcp-npm-package.json'))[0]
          paths=[f['path'] for f in data['files']]
          assert data['name']=='aws-emulator-mcp'
          import pathlib
          declared=set(json.loads(pathlib.Path('package.json').read_text())['files'])
          allowed=declared|{'package.json','LICENSE','README.md'}
          assert set(paths)==allowed, {'extra':sorted(set(paths)-allowed),'missing':sorted(allowed-set(paths))}
          assert 'docs/assets/hero.svg' in paths and 'docs/assets/demos/tour-preview.gif' in paths and 'docs/onboarding/index.html' in paths
          assert 'docs/COVERAGE.md' in paths
          assert not any('__pycache__' in p or p.endswith('.pyc') or '.env' in p or 'credentials' in p.lower() for p in paths)
          print('npm_package_file_count',len(paths),'strict allowlist PASS')
          PY
          npm pack --silent
          npm install --prefix .qa-npm --no-audit --no-fund --ignore-scripts ./aws-emulator-mcp-0.4.0-beta.6.tgz
          node .qa-npm/node_modules/aws-emulator-mcp/bin/aws-emulator-mcp.mjs config copilot > /tmp/aws-emulator-mcp-mcp-config.json
          python3 - <<'PY'
          import json
          conf=json.load(open('/tmp/aws-emulator-mcp-mcp-config.json'))
          assert conf['mcpServers']['aws-emulator-local']['type']=='stdio'
          PY

  docker-bundle-live:
    name: Docker bundle / real MCP SDK integration
    needs: npm-package-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install the packed npm package in isolation
        run: |
          npm pack --silent
          npm install --prefix .qa-npm --no-audit --no-fund --ignore-scripts ./aws-emulator-mcp-0.4.0-beta.6.tgz
      - name: Verify the reference patch applies to the actual buggy application
        run: |
          temp_dir="$(mktemp -d)"
          cp examples/order-intake/buggy/order_service.py "$temp_dir/order_service.py"
          (cd "$temp_dir" && git apply "$GITHUB_WORKSPACE/examples/order-intake/reference.patch")
          cmp "$temp_dir/order_service.py" examples/order-intake/fixed/order_service.py
          rm -rf "$temp_dir"
      - name: Build signed official emulator and run actual Docker MCP demo and SDK API calls
        run: |
          export AWS_EMULATOR_MCP_QA_CLI="$(pwd)/.qa-npm/node_modules/aws-emulator-mcp/bin/aws-emulator-mcp.mjs"
          python3 tests/docker_bundle_smoke.py
      - name: Publish actual read-only coverage results in the CI summary
        run: |
          mkdir -p reports
          node .qa-npm/node_modules/aws-emulator-mcp/bin/aws-emulator-mcp.mjs coverage --json > reports/ci_coverage.json
          python3 - <<'PY_END' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          j=json.loads(Path("reports/ci_coverage.json").read_text())
          assert j["totalProbes"] == 20 and j["successfulProbes"] == 20
          print("### Isolated AWS SDK coverage smoke test")
          print("- Official AWS Emulator:",j["emulatorVersion"])
          print("- SDK-modeled services:",j["modeledServiceCount"],"(models != implemented APIs)")
          print("- Read-only successful responses:",str(j["successfulProbes"])+"/"+str(j["totalProbes"]))
          print("- Each probe is a zero-argument, read-only API call. **This is not full AWS fidelity.**")
          print("")
          print("| Service | Operation | Outcome |")
          print("| :-- | :-- | :-- |")
          for row in j["results"]:
              print("|",row["service"],"|",row["operation"],"|",row["status"],"|")
          PY_END
      - name: Compare current API smoke results against last published baseline
        run: |
          node .qa-npm/node_modules/aws-emulator-mcp/bin/aws-emulator-mcp.mjs coverage-diff             docs/evidence/coverage-aws-emulator-1.0.343.json reports/ci_coverage.json --json > reports/ci_coverage_diff.json
          python3 - <<'PY_END' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          result=json.loads(Path("reports/ci_coverage_diff.json").read_text())
          assert result["passed"] and result["comparable"]
          print("### AWS Emulator fixed-probe regression check")
          print("- Baseline:",result["baselineVersion"])
          print("- Current:",result["currentVersion"])
          print("- Regressions:",len(result["regressions"]))
          print("- Exact operation set matched; **no general AWS parity implied**.")
          PY_END
      - name: Verify no production credentials are available to the image
        run: |
          docker run --rm --network none --entrypoint env aws-emulator-mcp:0.4.0-beta.6 | grep '^AWS_EMULATOR_MCP_ISOLATED_LAB=1$'
          docker image inspect aws-emulator-mcp:0.4.0-beta.6 --format '{{.Size}}' | tee /tmp/aws-emulator-mcp-image-size

  live-official-aws:
    name: Signed AWS Emulator / real E2E
    needs: [unit-and-protocol, client-sdk-interop, windows-source-preview]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Fresh Linux quickstart with signed AWS Emulator and runnable order example
        run: |
          bash install.sh
          test -s generated/mcp-client.linux.json
          test -s generated/copilot-mcp.linux.json
          bash scripts/order_demo_linux.sh
      - name: Run complete real MCP service test
        run: python scripts/live_test.py
      - name: Measure reliability, latency, and scoped cleanup
        run: |
          python scripts/gtm_benchmark.py --skip-unit --repetitions 5
          test -s reports/gtm_dashboard.html
      - name: Stop only the MCP-managed test process
        if: always()
        run: |
          PYTHONPATH=src python - <<'PY'
          from aws_emulator_mcp import server
          try:
              print(server.stop())
          except Exception as exc:
              print("No MCP-managed process to stop:", type(exc).__name__)
          PY
      - name: Record sanitized benchmark evidence without artifact storage
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("### Live AWS Emulator QA")
          for file in ("reports/latest_live.json","reports/gtm_latest.json"):
              if not Path(file).exists():
                  print("- ",file,": NOT AVAILABLE")
                  continue
              data=json.loads(Path(file).read_text())
              if file.endswith("gtm_latest.json"):
                  print("- benchmark:", "PASS" if data["engineering_pass"] else "FAIL")
                  for gate in data["gates"]:
                      print("  -",gate["name"],gate["status"],gate["observed"])
              else:
                  print("- live service checks:",data.get("service_checks"))
                  print("- resource cleanup:",data.get("resource_cleanup"))
          PY
