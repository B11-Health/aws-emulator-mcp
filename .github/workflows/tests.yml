name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-protocol:
    name: Unit & MCP / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and run all unit/security tests
        run: |
          python -m compileall -q src tests scripts
          python -m unittest discover -s tests -q
      - name: Independent legacy/modern MCP checker
        run: |
          mkdir -p reports
          python scripts/mcp_launch_check.py --out reports/ci_protocol.json --min-tools 27 -- python -u src/aws_emulator_mcp/server.py
      - name: Build installable wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m zipfile -t dist/*.whl
      - name: Record protocol evidence without artifact storage
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          result=json.load(open("reports/ci_protocol.json"))
          assert result["passed"]
          print("### Independent MCP protocol check")
          for run in result["runs"]:
              print("- ",run["scope"],":", "PASS" if run["passed"] else "FAIL")
          PY

  client-sdk-interop:
    name: Official Python + TypeScript MCP SDK clients
    needs: unit-and-protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Official Python SDK v2.3.0 interop, both protocol eras
        run: |
          python -m pip install --disable-pip-version-check mcp==2.3.0
          python tests/external_clients/python_client.py
      - name: Official TypeScript SDK v2.4.0 interop, both protocol eras
        run: |
          npm ci --prefix tests/external_clients --no-audit --no-fund --ignore-scripts
          node tests/external_clients/node_client.mjs

  live-official-aws:
    name: Signed AWS Emulator / real E2E
    needs: [unit-and-protocol, client-sdk-interop]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Download and verify official AWS Emulator
        run: bash scripts/install_wsl.sh
      - name: Run complete real MCP service test
        run: python scripts/live_test.py
      - name: Measure reliability, latency, and scoped cleanup
        run: python scripts/gtm_benchmark.py --skip-unit --repetitions 5
      - name: Stop only the MCP-managed test process
        if: always()
        run: |
          PYTHONPATH=src python - <<'PY'
          from aws_emulator_mcp import server
          try:
              print(server.stop())
          except Exception as exc:
              print("No MCP-managed process to stop:", type(exc).__name__)
          PY
      - name: Record sanitized benchmark evidence without artifact storage
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("### Live AWS Emulator QA")
          for file in ("reports/latest_live.json","reports/gtm_latest.json"):
              if not Path(file).exists():
                  print("- ",file,": NOT AVAILABLE")
                  continue
              data=json.loads(Path(file).read_text())
              if file.endswith("gtm_latest.json"):
                  print("- benchmark:", "PASS" if data["engineering_pass"] else "FAIL")
                  for gate in data["gates"]:
                      print("  -",gate["name"],gate["status"],gate["observed"])
              else:
                  print("- live service checks:",data.get("service_checks"))
                  print("- resource cleanup:",data.get("resource_cleanup"))
          PY
